version: 2

models:
  - name: int_customer
    description: this model contains the customers information.
    columns:
      - name: customer_key
        tests:
          - not_null
          - unique

  - name: int_payment
    description: this model contains the payment information.
    columns:
      - name: payment_key
        tests:
          - not_null    
          - unique

  